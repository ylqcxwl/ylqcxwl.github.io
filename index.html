<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8"> <!-- 设置字符集为UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 设置视口宽度为设备宽度，初始缩放比例为1.0 -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> <!-- 设置IE浏览器的渲染模式为最新模式 -->
    <meta name="description" content="雨落倾城夏微凉"> <!-- 设置页面的描述 -->
    <meta name="author" content="雨落倾城夏微凉"> <!-- 设置页面作者 -->
    <meta name="keywords" content="雨落倾城夏微凉"> <!-- 设置页面的关键词 -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon"> <!-- 设置网站图标 -->
    <link rel="stylesheet" href="/css/style.css"> <!-- 引入CSS样式表 -->
    <link rel="stylesheet" href="/css/iconfont/iconfont.css"> <!-- 引入CSS样式表 -->
    <link rel="stylesheet" href="/css/animation.css"> <!-- 引入CSS动画样式表 -->
    <title>雨落倾城夏微凉</title> <!-- 设置页面标题 -->
</head>

<style>
    /* 全局样式重置 */
    * {
        margin: 0; /* 清除默认外边距 */
        padding: 0; /* 清除默认内边距 */
        box-sizing: border-box; /* 定义盒模型的计算方式 */
    }

    body {
        background-image: url('5.jpg'); /* 替换为你自己的图片链接 */
        background-size: cover; /* 使背景图片覆盖整个页面 */
        background-position: center; /* 图片居中 */
        background-repeat: no-repeat; /* 防止背景图重复 */
        height: 100vh; /* 使body高度为视口高度 */
        margin: 0; /* 去掉默认的margin */
    }

    /* 左侧导航样式 */
    .left-nav {
        width: 150px; /* 左侧导航宽度 */
        height: calc(100% - 10px); /* 调整高度以保持与底部间距，减去顶部和底部间距 */
        position: fixed; /* 固定定位 */
        top: 5px; /* 距离顶部距离 */
        left: 5px; /* 距离左侧距离 */
        bottom: 5px; /* 距离底部底部距离 */
        padding: 30px 15px; /* 内边距 */
        background: rgba(255, 255, 255, 0.5); /* 背景颜色，设置为白色且半透明 */
        backdrop-filter: blur(10px); /* 背景模糊效果 */
        border-radius: 10px 0 0 10px; /* 添加圆角 */
    }

    /* 用户信息样式 */
    .user {
        display: flex; /* 使用Flexbox布局 */
        flex-direction: column; /* 让头像和昵称垂直排列 */
        align-items: center; /* 水平居中 */
        width: 100%; /* 容器宽度为100% */
        height: 120px; /* 左侧导航高度 */
        border-radius: 8px; /* 边角圆润 */
    }

    .user-img {
        width: 80px; /* 用户头像宽度设置为80px */
        border-radius: 50%; /* 设置为圆形头像 */
        margin: 0; /* 去掉额外的外边距 */
    }

    .user-name {
        display: block; /* 隐藏 */
        font-weight: bold; /* 字体加粗 */
        color: #111313; /* 字体颜色 */
        margin: 10px 0 0 0; /* 上边距20px，左右、下边距为0 */
        padding: 0; /* 内边距为0 */
        text-align: center; /* 文本居中 */
        transition: display 0.3s; /* 显示/隐藏过渡效果 */
    }

    /* 导航列表样式 */
    .nav-list {
        display: flex; /* 使用弹性盒布局 */
        flex-direction: column; /* 子元素排列方向为垂直 */
        align-items: left; /* 子元素垂直居中 */
        justify-content: space-between; /* 子元素水平居中 */
        width: 100%; /* 宽度 */
        height: 50%; /* 高度 */
        list-style: none; /* 去掉列表符号 */
        margin-top: 30px; /* 顶部外边距30px */
        padding: 0 ; /* 内边距为0 */
    }

    .nav-list li {
        width: 100%; /* 宽度 */
        height: 50px; /* 高度 */
        display: flex; /* 使用弹性盒布局 */
        align-items: center; /* 垂直居中 */
        justify-content: center; /* 水平居中 */
        font-size: 16px; /* 字体大小 */
        color: #333; /* 字体颜色 */
        padding: 0px; /* 内边距 */
        border-radius: 10px; /* 添加圆角 */
        transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s; /* 增加变换和阴影的过渡效果 */
    }

    .nav-list li:hover {
        cursor: pointer; /* 鼠标悬停时鼠标样式 */
        transform: scale(1.1); /* 鼠标悬停时稍微放大 */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* 添加阴影效果 */
    }

    .nav-list li.active {
        cursor: default; /* 禁用鼠标悬停样式 */
        transform: scale(1.1); /* 放大效果 */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* 添加阴影效果 */
    } /* 高亮显示当前选中的导航项 */

    .left-nav li a {
        display: flex; /* 使用Flexbox布局 */
        align-items: center; /* 垂直居中 */
        justify-content: center; /* 水平居中 */
        width: 100%; /* 宽度 */
        height: 100%; /* 高度 */
        padding: 0px 10px; /* 内边距 */
        position: relative; /* 位置相对 */
        white-space: nowrap; /* 不换行 */
        text-decoration: none; /* 去掉下划线 */
        color: #333; /* 字体颜色 */
        transition: color 0.3s; /* 字体颜色变化时的过渡效果 */
    }

    .code {
        display: flex; /* 使用Flexbox布局 */
        cursor: pointer; /* 鼠标悬停时鼠标样式 */
        width: 100%; /* 宽度 */
        height: 150px; /* 高度 */
        margin: 30px 0px 0px 10px; /* 外边距30px */
        border: 1px solid #85dde4; /* 边框 */
        border-radius: 10px; /* 添加圆角 */
    }

    .code a {
        display: flex; /* 使用Flexbox布局 */
        align-items: center; /* 垂直居中 */
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        color: #98c937; /* 字体颜色 */
        width: 100%; /* 宽度 */
        height: 100%; /* 高度 */
    }
    .code .iconfont {
        font-size: 80px; /* 增加图标大小 */
        transition: color 0.3s; /* 字体颜色变化时的过渡效果 */
    }
    .code:hover .iconfont{
        transform: scale(1.3); /* 放大效果 */
        color: #333; /* 字体颜色 */
        }

    /* 主要部分内容样式 */
    .main-content {
        width: calc(100% - 160px); /* 宽度 */
        height: calc(100% - 10px); /* 高度 */
        position: fixed; /* 固定定位 */
        background: rgba(250, 252, 251, 0.5); /* 背景颜色，设置为白色且半透明 */
        backdrop-filter: blur(5px); /* 背景模糊效果 */
        border-radius: 0 10px 0px 0 ; /* 添加圆角 */
        top: 5px; /* 距离顶部距离 */
        left: 160px; /* 距离左侧距离 */
        right: 5px; /* 距离右侧距离 */
        bottom: 5px; /* 距离底部距离 */
        overflow: hidden; /* 隐藏溢出 */
        transition: left 0.5s; /* 左侧距离变化时的过渡效果 */
    }

    .content {
        display: none; /* 默认隐藏所有内容 */
    }

    .active {
        display: block; /* 活动内容显示 */
    }

    section {
        position: relative; /* 相对定位 */
        width: 100%; /* 宽度 */
        height: 100vh; /* 高度 */
        display: flex; /* 使用Flexbox布局 */
    }
</style>

<body>
    <div class="container-nav">
        <div class="left-nav">
            <div class="user">
                <img src="imgs/icon/favicon.ico" class="user-img">
                <span class="user-name">
                    <p>雨落倾城夏微凉</p>
                    <p>zhuy</p>
                </span>
            </div>
            <ul class="nav-list">
                <li>
                    <a href="#" onclick="showContent(1)"> <!-- 导航项 -->
                        <div class="iconfont shouye">&#xe8b9;</div> <!-- 首页图标 -->
                        <div> 首页 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(2)"> <!-- 导航项 -->
                        <div class="iconfont ziyuan">&#xe8a4;</div> <!-- 资源图标 -->
                        <div> 资源 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(3)"> <!-- 导航项 -->
                        <div class="iconfont zhaoxiangji">&#xe663;</div> <!-- 相册图标 -->
                        <div> 相册 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(4)"> <!-- 导航项 -->
                        <div class="iconfont yingyongzhongxin">&#xe623;</div> <!-- 应用中心图标 -->
                        <div> 应用 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(5)"> <!-- 导航项 -->
                        <div class="iconfont mingpian">&#xe621;</div> <!-- 名片图标 -->
                        <div> 名片 </div>
                    </a>
                </li>
            </ul>
            <div class="code">
                <a>
                    <div class="iconfont erweima">&#xe642;</div> <!-- code图标 -->
                </a>
            </div>
    </div>
    <main>
        <div class="main-content">
            <section class="content content1 active"> <!-- 初始显示主页的内容 -->
                <h1>主页内容</h1> <!-- 页面标题 -->
                <p>欢迎来到雨落倾城夏微凉！</p> <!-- 页面文本 -->
            </section>
            <section class="content content2"> <!-- 第二个内容区块 -->
                <h2>资源内容</h2> <!-- 页面标题 -->
                <p>资源内容</p> <!-- 页面文本 -->
            </section>
            <section class="content content3"> <!-- 第三个内容区块 -->
                <p>相册内容</p> <!-- 页面文本 -->
                <img src="imgs/icon/favicon.ico" alt="图片加载失败"> <!-- 图片 -->
            </section>
            <section class="content content4"> <!-- 第四个内容区块 -->
                <p>应用内容</p> <!-- 页面文本 -->
                <img src="imgs/icon/favicon.ico" alt="图片加载失败"> <!-- 图片 -->
            </section>
            <section class="content content5"> <!-- 第五个内容区块 -->
                <p>名片内容</p> <!-- 页面文本 -->
            </section>
        </div>
    </main>
    <script>
        // 显示对应内容的函数
        function showContent(option) {
            // 隐藏所有内容
            const contents = document.querySelectorAll('.content');
            contents.forEach(content => {
                content.classList.remove('active'); // 移除活动状态
            });

            // 根据选项显示相应内容
            if (option === 1) {
                document.querySelector('.content1').classList.add('active'); // 显示内容1
            } else if (option === 2) {
                document.querySelector('.content2').classList.add('active'); // 显示内容2
            } else if (option === 3) {
                document.querySelector('.content3').classList.add('active'); // 显示内容3
            } else if (option === 4) {
                document.querySelector('.content4').classList.add('active'); // 显示内容4
            } else if (option === 5) {
                document.querySelector('.content5').classList.add('active'); // 显示内容5
            }

            // 高亮显示被点击的导航项
            const navItems = document.querySelectorAll('.nav-list li');
            navItems.forEach(item => {
                item.classList.remove('active'); // 移除所有导航项的活动状态
            });
            navItems[option - 1].classList.add('active'); // 仅将被点击的导航项设为活动
        }

        // 设置默认选中项
        document.addEventListener('DOMContentLoaded', function() {
            showContent(1); // 默认显示首页内容和设置导航为活动状态
        });
    </script>
</body>

</html>
