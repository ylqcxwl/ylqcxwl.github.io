<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="雨落倾城夏微凉">
    <meta name="author" content="雨落倾城夏微凉">
    <meta name="keywords" content="雨落倾城夏微凉">
    <link rel="shortcut icon" href="/ylqcxwl copy/imgs/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/iconfont/iconfont.css">
    <link rel="stylesheet" href="css/animation.css">
    <title>雨落倾城夏微凉</title>
</head>

<style>
    /* 全局样式重置 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-image: url('5.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        margin: 0;
    }

    /* 左侧导航样式 */
    .left-nav {
        width: 150px;
        height: calc(100% - 10px);
        position: fixed;
        top: 5px;
        left: 5px;
        bottom: 5px;
        padding: 30px 15px;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
        border-radius: 10px;
    }

    /* 用户信息样式 */
    .user {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 120px;
        border-radius: 8px;
    }

    .user-img {
        width: 80px;
        border-radius: 50%;
        margin: 0;
    }

    .user-name {
        text-align: center;
        font-weight: bold;
        color: #111313;
    }

    /* 导航列表样式 */
    .nav-list {
        display: flex;
        flex-direction: column;
        align-items: left;
        justify-content: space-between;
        width: 100%;
        height: 50%;
        list-style: none;
        margin-top: 30px;
        padding: 0;
    }

    .nav-list li {
        width: 100%;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: left;
        font-size: 16px;
        color: #333;
        padding: 0px;
        border-radius: 10px;
        transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }

    .nav-list li:hover {
        cursor: pointer;
        transform: scale(1.1);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .nav-list li.active {
        cursor: default;
        transform: scale(1.1);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .left-nav li a {
        display: flex;
        align-items: center;
        justify-content: left;
        width: 100%;
        height: 100%;
        padding: 0px 10px;
        position: relative;
        white-space: nowrap;
        text-decoration: none;
        color: #333;
        transition: color 0.3s;
    }

    .main-content {
        width: calc(100% - 160px);
        height: calc(100% - 10px);
        position: fixed;
        background: rgba(250, 252, 251, 0.5);
        backdrop-filter: blur(5px);
        border-radius: 10px;
        top: 5px;
        left: 160px;
        right: 5px;
        bottom: 5px;
        overflow: hidden;
    }

    .content {
        display: none;
    }

    .content.active {
        display: block;
    }

    section {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* 开始从顶部对齐 */
        align-items: center;
        padding: 20px; /* 给内容区添加内边距 */
    }

    /* 搜索框样式 */
    .search-container {
        margin-bottom: 20px; /* 增加下方间距以防止与其他内容重叠 */
        display: flex;
        align-items: center;
        width: 100%;
    }

    .search-container select,
    .search-container input,
    .search-container button {
        margin-right: 10px; /* 输入框与按钮之间的间距 */
        padding: 10px; /* 内边距 */
        border-radius: 5px; /* 圆角 */
        border: 1px solid #ccc; /* 边框样式 */
        outline: none; /* 去掉默认轮廓 */
        transition: border 0.3s; /* 边框过渡效果 */
    }

    .search-container select:hover,
    .search-container input:hover,
    .search-container button:hover {
        border-color: #777; /* 鼠标悬停时边框颜色变化 */
    }

    .search-container button {
        background-color: #4CAF50; /* 按钮背景色 */
        color: white; /* 按钮文字颜色 */
        cursor: pointer; /* 鼠标指针 */
        border: none; /* 按钮去掉边框 */
        transition: background-color 0.3s; /* 背景色过渡效果 */
    }

    .search-container button:hover {
        background-color: #45a049; /* 鼠标悬停时按钮背景色变化 */
    }
</style>

<body>
    <div class="container-nav">
        <div class="left-nav">
            <div class="user">
                <img src="imgs/icon/favicon.ico" class="user-img">
                <span class="user-name">
                    <p>雨落倾城夏微凉</p>
                    <p>zhuy</p>
                </span>
            </div>
            <ul class="nav-list">
                <li>
                    <a href="#" onclick="showContent(1)">
                        <div class="iconfont shouye">&#xe8b9;</div>
                        <div> 首页 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(2)">
                        <div class="iconfont ziyuan">&#xe8a4;</div>
                        <div> 资源 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(3)">
                        <div class="iconfont zhaoxiangji">&#xe663;</div>
                        <div> 相册 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(4)">
                        <div class="iconfont yingyongzhongxin">&#xe623;</div>
                        <div> 应用 </div>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="showContent(5)">
                        <div class="iconfont mingpian">&#xe621;</div>
                        <div> 名片 </div>
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <main>
        <div class="main-content">
            <section class="content content1 active">
                <h1>主页内容</h1>
                <div class="search-container">
                    <select id="search-type">
                        <option value="site">本站搜索</option>
                        <option value="google">Google搜索</option>
                        <option value="bing">Bing搜索</option>
                    </select>
                    <input type="text" id="search-input" placeholder="输入搜索内容..." />
                    <button id="search-button">搜索</button>
                </div>
            </section>
            <section class="content content2">
                <h2>资源内容</h2>
            </section>
            <section class="content content3">
                <p>相册内容</p>
            </section>
            <section class="content content4">
                <p>应用内容</p>
            </section>
            <section class="content content5">
                <p>名片内容</p>
            </section>
        </div>
    </main>
    <script>
        function showContent(option) {
            const contents = document.querySelectorAll('.content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            if (option === 1) {
                document.querySelector('.content1').classList.add('active');
            } else if (option === 2) {
                document.querySelector('.content2').classList.add('active');
            } else if (option === 3) {
                document.querySelector('.content3').classList.add('active');
            } else if (option === 4) {
                document.querySelector('.content4').classList.add('active');
            } else if (option === 5) {
                document.querySelector('.content5').classList.add('active');
            }

            const navItems = document.querySelectorAll('.nav-list li');
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            navItems[option - 1].classList.add('active');
        }

        // 搜索功能
        document.getElementById('search-button').addEventListener('click', function () {
            const query = document.getElementById('search-input').value;
            const searchType = document.getElementById('search-type').value;

            if (searchType === 'site') {
                // 本站搜索逻辑
                let contents = document.querySelectorAll('.content');
                contents.forEach(content => {
                    if (content.textContent.toLowerCase().includes(query.toLowerCase())) {
                        content.style.display = 'block';
                    } else {
                        content.style.display = 'none';
                    }
                });
            } else {
                // 外部搜索逻辑
                let searchUrl = '';
                if (searchType === 'google') {
                    searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                } else if (searchType === 'bing') {
                    searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
                }
                window.open(searchUrl, '_blank'); // 在新标签页打开搜索结果
            }
        });
    </script>
</body>

</html>
