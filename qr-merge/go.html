<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打开收款码</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f6f8;color:#1f2329;padding:24px}
  .card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:32px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);text-align:center}
  .logo{font-size:13px;color:#8a9099;margin-bottom:18px;letter-spacing:1px}
  h1{font-size:20px;margin:0 0 8px}.sub{font-size:14px;color:#7b828c;margin:0 0 26px}
  a.btn{display:block;width:100%;padding:15px;border-radius:12px;color:#fff;text-decoration:none;
    font-size:16px;font-weight:600;margin-bottom:12px}
  .wx{background:#07c160}.ali{background:#1677ff}.ghost{background:#eef0f3;color:#1f2329}
  .tip{font-size:12px;color:#9aa0a8;line-height:1.7;margin-top:18px}
  img.qr{width:220px;max-width:80%;border-radius:10px;margin:4px auto 18px;display:block}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
(function () {
  'use strict';
  var card = document.getElementById('card');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function decodePayload(payload) {
    try {
      var s = String(payload || '').replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(decodeURIComponent(escape(atob(s))));
    } catch (e) {
      return null;
    }
  }

  function allowedUrl(u) {
    try {
      var p = new URL(String(u));
      return ['http:', 'https:', 'wxp:', 'alipayqr:', 'alipay:'].indexOf(p.protocol) !== -1;
    } catch (e) {
      return false;
    }
  }

  function detectApp(ua) {
    if (/MicroMessenger/i.test(ua)) return 'wechat';
    if (/AlipayClient|Alipay/i.test(ua)) return 'alipay';
    return 'other';
  }

  var params = new URLSearchParams(location.search);
  var payload = params.get('d') || '';
  var data = decodePayload(payload);
  if (!data) {
    card.innerHTML = '<div class="logo">一码通</div><h1>二维码无效</h1><p class="sub">链接内容已损坏</p>';
    return;
  }

  var force = params.get('force');
  var noauto = params.get('noauto') === '1';
  var app = (force === 'wechat' || force === 'alipay') ? force : detectApp(navigator.userAgent);
  var name = data.n || '收款码';
  var query = '?d=' + encodeURIComponent(payload);
  var backLink = 'go.html' + query + '&force=other';

  if (app === 'wechat' || app === 'alipay') {
    var isWx = app === 'wechat';
    var target = isWx ? data.w : data.a;
    var label = isWx ? '微信收款码' : '支付宝收款码';
    var img = isWx ? data.wi : data.ai;
    var btnClass = isWx ? 'wx' : 'ali';
    if (!allowedUrl(target)) {
      card.innerHTML = '<div class="logo">一码通</div><h1>' + esc(name) + '</h1><p class="sub">该渠道尚未设置收款码</p>';
      return;
    }
    var html = '<div class="logo">一码通 · 收款码合并</div><h1>' + esc(name) + '</h1>' +
      '<p class="sub">正在打开『' + esc(label) + '』</p>';
    if (img && allowedUrl(img)) {
      html += '<img class="qr" src="' + esc(img) + '" alt="' + esc(label) + '">' +
        '<p class="tip">若未自动跳转，可长按上方图片识别付款</p>';
    }
    html += '<a class="btn ' + btnClass + '" href="' + esc(target) + '">打开' + esc(label) + '</a>' +
      '<a class="btn ghost" href="' + esc(backLink) + '">返回选择页</a>';
    card.innerHTML = html;
    if (!noauto) {
      setTimeout(function () { window.location.href = target; }, 500);
    }
  } else {
    var html2 = '<div class="logo">一码通 · 收款码合并</div><h1>' + esc(name) + '</h1>' +
      '<p class="sub">请选择你的付款方式</p>';
    if (data.w && allowedUrl(data.w)) {
      html2 += '<a class="btn wx" href="go.html' + query + '&force=wechat&noauto=1">微信支付</a>';
    }
    if (data.a && allowedUrl(data.a)) {
      html2 += '<a class="btn ali" href="go.html' + query + '&force=alipay&noauto=1">支付宝支付</a>';
    }
    html2 += '<p class="tip">用微信扫 → 微信收款码<br>用支付宝扫 → 支付宝收款码</p>';
    card.innerHTML = html2;
  }
})();
</script>
</body>
</html>
