name: 更新工具清单

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "scripts/generate_tools.py"
      - ".github/workflows/update-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成工具清单
        run: python3 scripts/generate_tools.py

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS/tools-data.js
          if git diff --cached --quiet; then
            echo "工具清单没有变化"
          else
            git commit -m "自动生成工具清单"
            git push
          fi
